services:
  - type: web
    name: efootball-v228-web
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: true
      # Free planda disk yok - veriler deploy/restart'te silinir, yedekle geri yuklenir
      # Kalici disk icin Render Starter ($7/ay) gerekir - o zaman DATA_DIR=/data + disk ekle
